name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: saas_seeder
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: saas_seeder
      DB_USER: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, json
          tools: composer
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --locked
      - run: composer check
      - name: Apply and validate every migration
        shell: pwsh
        run: .\scripts\setup\setup-database.ps1
      - name: Prove migration reruns are no-ops
        shell: pwsh
        run: .\scripts\setup\setup-database.ps1
